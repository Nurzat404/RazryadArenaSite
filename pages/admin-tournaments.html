<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Турниры — РазрядАрена</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/layouts.css" />
    <link rel="stylesheet" href="../assets/css/pages.css" />
    <link rel="stylesheet" href="../assets/css/responsive.css" />
  </head>
  <body class="layout-admin" data-page="admin-tournaments" data-role="admin">
    <div class="app-shell">
            <aside class="app-sidebar" data-component="admin-sidebar">
        <div class="app-sidebar-title">Admin Panel</div>
        <div class="app-sidebar-group">
          <div class="app-sidebar-group-title">Обзор</div>
          <a class="app-sidebar-link" href="admin-dashboard.html">Dashboard</a>
        </div>
        <div class="app-sidebar-group">
          <div class="app-sidebar-group-title">Управление</div>
          <a class="app-sidebar-link" href="admin-users.html">Пользователи</a>
          <a class="app-sidebar-link" href="admin-teams.html">Команды</a>
          <a class="app-sidebar-link is-active" href="admin-tournaments.html">Турниры</a>
          <a class="app-sidebar-link" href="admin-matches.html">Матчи</a>
          <a class="app-sidebar-link" href="admin-ratings.html">Рейтинг</a>
          <a class="app-sidebar-link" href="admin-content.html">Контент</a>
        </div>
      </aside>
      <main class="app-content">
        <header class="app-topbar d-flex justify-content-between align-items-center flex-wrap gap-2">
          <h1 class="h4 mb-0">Управление турнирами</h1>
          <button class="cta-button cta-button-primary" type="button">+ Новый турнир</button>
        </header>
        <section class="filter-panel mb-3" data-filter-group>
          <div class="d-flex gap-2 flex-wrap">
            <button class="filter-chip is-active" type="button" data-filter-chip>Все</button>
            <button class="filter-chip" type="button" data-filter-chip>registration</button>
            <button class="filter-chip" type="button" data-filter-chip>active</button>
            <button class="filter-chip" type="button" data-filter-chip>finished</button>
          </div>
        </section>
        <article class="table-block">
          <table class="table table-dark-custom">
            <thead><tr><th>ID</th><th>Название</th><th>Спорт</th><th>Команды</th><th>Статус</th><th>Действие</th></tr></thead>
            <tbody>
              <tr><td>12</td><td>RA Open Cup #12</td><td>CS2</td><td>12/16</td><td><span class="status-badge is-pending">registration</span></td><td><a href="admin-tournament-detail.html">Управлять</a></td></tr>
              <tr><td>11</td><td>City Football League</td><td>Футбол</td><td>12/12</td><td><span class="status-badge is-active">active</span></td><td><a href="admin-tournament-detail.html">Управлять</a></td></tr>
              <tr><td>10</td><td>Street Basket Weekend</td><td>Баскетбол</td><td>8/8</td><td><span class="status-badge is-completed">finished</span></td><td><a href="admin-tournament-detail.html">Архив</a></td></tr>
            </tbody>
          </table>
        </article>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/main.js"></script>
  </body>
</html>
