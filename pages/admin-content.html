<!doctype html>
<html lang="ru">
  <head>

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="stylesheet" href="../assets/css/main.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />

  <body class="layout-admin" data-page="admin-content" data-role="admin">
    <div class="app-shell">
        <aside class="app-sidebar" data-component="admin-sidebar">
        <div class="app-sidebar-title">Admin Panel</div>
        <div class="app-sidebar-group">
          <div class="app-sidebar-group-title">Обзор</div>
          <a class="app-sidebar-link" href="admin-dashboard.html">Dashboard</a>
        </div>
        <div class="app-sidebar-group">
          <div class="app-sidebar-group-title">Управление</div>
          <a class="app-sidebar-link" href="admin-users.html">Пользователи</a>

          <a class="app-sidebar-link" href="admin-tournaments.html">Турниры</a>
          <a class="app-sidebar-link" href="admin-matches.html">Матчи</a>
          <a class="app-sidebar-link" href="admin-ratings.html">Рейтинг</a>
          <a class="app-sidebar-link is-active" href="admin-content.html">Контент</a>

      <main class="app-content">
        <header class="app-topbar"><h1 class="h4 mb-0">Управление правилами и FAQ</h1></header>
        <div class="row g-3">
          <div class="col-lg-6">
            <article class="form-panel">

              <div class="content-editor-demo">1. Общие положения...<br />2. Поведение участников...<br />3. Санкции...</div>

          </div>
          <div class="col-lg-6">
            <article class="form-panel">
              <h2 class="h5">Редактор FAQ</h2>
              <div class="content-editor-demo">Q: Как подать заявку?<br />A: Через карточку турнира...</div>
              <button class="cta-button cta-button-primary mt-2" type="button">Сохранить FAQ</button>
            </article>
          </div>
        </div>
      </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
